name: Train 60-minute research model

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-60m:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Run empirical 60-minute pipeline
        shell: bash
        run: |
          mkdir -p artifacts/reports
          set -o pipefail
          python tools/train_60m.py \
            --source yfinance \
            --symbol UNG \
            --period 60d \
            --artifact-root artifacts/models \
            --summary-path artifacts/reports/60m-latest.json \
            --minimum-rows 1500 \
            --minimum-train-size 1000 \
            --validation-size 300 \
            --test-size 300 \
            --purge-size 12 \
            --embargo-size 12 \
            --calibration-rows 250 \
            2>&1 | tee artifacts/reports/60m-run.log
      - name: Upload empirical research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empirical-60m-research
          path: |
            artifacts/models/60m
            artifacts/reports/60m-latest.json
            artifacts/reports/60m-run.log
          if-no-files-found: warn
          retention-days: 30
