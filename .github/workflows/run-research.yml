name: UNG Research Run
on:
  schedule:
    - cron: "30 2 * * 2-6"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ungmj-research-run
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Run fail-closed forecast pipeline
        run: python -m ungmj.cli --output-dir data/ledger
      - name: Build read-only dashboard
        if: always()
        run: python scripts/publish_site.py
      - name: Preserve report and dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ungmj-research-${{ github.run_id }}
          path: |
            site/
            data/ledger/latest-run.json
            data/ledger/forecasts.jsonl
            data/ledger/outcomes.jsonl
          if-no-files-found: warn
          retention-days: 30
