name: UNG Research Run
on:
  schedule:
    - cron: "30 2 * * 2-6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ungmj-research-run
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Restore persistent research ledger
        run: |
          git fetch origin research-state
          git checkout origin/research-state -- data/ledger
          mkdir -p data/ledger
      - name: Run fail-closed forecast pipeline
        run: python -m ungmj.cli --output-dir data/ledger
      - name: Build read-only dashboard
        if: always()
        run: python scripts/publish_site.py
      - name: Persist append-only research state
        if: always()
        run: |
          mkdir -p /tmp/ungmj-ledger-state
          cp -a data/ledger/. /tmp/ungmj-ledger-state/
          git worktree add -b research-state /tmp/ungmj-state origin/research-state
          mkdir -p /tmp/ungmj-state/data/ledger
          cp -a /tmp/ungmj-ledger-state/. /tmp/ungmj-state/data/ledger/
          cd /tmp/ungmj-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger
          if ! git diff --cached --quiet; then
            git commit -m "Persist UNGMJ research run ${{ github.run_id }}"
            git push origin HEAD:research-state
          fi
      - name: Preserve report and dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ungmj-research-${{ github.run_id }}
          path: |
            site/
            data/ledger/latest-run.json
            data/ledger/forecasts.jsonl
            data/ledger/outcomes.jsonl
          if-no-files-found: warn
          retention-days: 30
