name: Weekly Ridge challenger

on:
  schedule:
    - cron: "0 23 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ung-forecast
  cancel-in-progress: false

jobs:
  challenger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: UNG_MODELS=ridge python run_forecast.py
      - name: Persist challenger results
        run: |
          git config user.name "ung-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ledger
          git diff --cached --quiet || git commit -m "Update weekly Ridge challenger"
          git push
