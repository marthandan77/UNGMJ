name: Daily UNG forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python run_forecast.py
      - name: Persist ledger
        run: |
          git config user.name "ung-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ledger
          git diff --cached --quiet || git commit -m "Update rolling forecast ledger"
          git push
