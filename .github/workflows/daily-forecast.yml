name: Daily UNG forecast

concurrency:
  group: ung-forecast
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # Fetch delayed SIP after the 06:45 and 08:30 ET feature cutoffs, with a safety minute.
    # Paired UTC times cover both daylight and standard time; the runner guard skips the extra run.
    - cron: "2 11,12 * * 1-5"
    - cron: "47 12,13 * * 1-5"

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python run_forecast.py
      - name: Persist ledger
        run: |
          git config user.name "ung-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ledger
          git diff --cached --quiet || git commit -m "Update rolling forecast ledger"
          git push
