name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        shell: bash
        run: set -o pipefail; ruff check . --output-format=concise | tee ruff-report.txt
      - name: Mypy
        shell: bash
        run: set -o pipefail; mypy | tee mypy-report.txt
      - name: Tests
        shell: bash
        run: set -o pipefail; pytest --cov=ung_forecast --cov-report=term-missing --junitxml=pytest-report.xml | tee pytest-output.txt
      - name: Import smoke test
        run: python -c "import ung_forecast; import app"
      - name: Generate compliance report
        run: python tools/compliance_report.py
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            ruff-report.txt
            mypy-report.txt
            pytest-report.xml
            pytest-output.txt
            reports/build_compliance_report.md
            reports/build_compliance_report.json
          if-no-files-found: warn
